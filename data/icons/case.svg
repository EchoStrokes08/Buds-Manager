<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- REDMI Buds 8 Pro charging case (front): pebble / bathtub shape, shallow lid, slim battery light strip
       below the seam, matte metallic finish. Drawn from public photos. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="@hi@"/>
      <stop offset="0.45" stop-color="@mid@"/>
      <stop offset="1" stop-color="@lo@"/>
    </linearGradient>
    <linearGradient id="sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/>
      <stop offset="0.16" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.84" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="@lidhi@"/>
      <stop offset="1" stop-color="@lidlo@"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9f7ff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f7ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- colors: @tokens@ are filled per official color (theme.BUDS_COLORS) -->
  <!-- contact shadow -->
  <ellipse cx="64" cy="108" rx="40" ry="5.5" fill="#000" opacity="0.3"/>
  <!-- body -->
  <path id="shape" d="M 12 38 C 12 28 20 24 30 24 L 98 24 C 108 24 116 28 116 38 L 113 66 C 110 90 92 103 64 103 C 36 103 18 90 15 66 Z"
        fill="url(#body)" stroke="@edge@" stroke-opacity="@edgea@" stroke-width="1"/>
  <path d="M 12 38 C 12 28 20 24 30 24 L 98 24 C 108 24 116 28 116 38 L 113 66 C 110 90 92 103 64 103 C 36 103 18 90 15 66 Z"
        fill="url(#sides)"/>
  <!-- lid (shallow) -->
  <path d="M 12 38 C 12 28 20 24 30 24 L 98 24 C 108 24 116 28 116 38 L 115.4 43 L 12.6 43 Z" fill="url(#lid)"/>
  <!-- seam -->
  <path d="M 12.6 43.5 L 115.4 43.5" stroke="#5c6168" stroke-opacity="0.7" stroke-width="1.6"/>
  <path d="M 13 45.3 L 115 45.3" stroke="#fff" stroke-opacity="0.75" stroke-width="1"/>
  <!-- battery light strip -->
  <rect x="50" y="52" width="28" height="3.4" rx="1.7" fill="#3c4147" opacity="0.55"/>
  <rect x="52" y="52.4" width="24" height="2.6" rx="1.3" fill="url(#strip)"/>
  <!-- soft specular highlight on the body -->
  <path d="M 26 60 C 30 82 44 94 60 97" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M 30 29 C 50 27 78 27 98 29" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
</svg>
