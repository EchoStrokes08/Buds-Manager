<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- REDMI Buds 8 Pro case, closed, front view like the official app: soft squircle, thin seam above the
       middle and the white battery light bar. @tokens@ = palette (art.BUDS_COLORS). -->
  <defs>
    <radialGradient id="body" cx="0.48" cy="0.42" r="0.62">
      <stop offset="0" stop-color="@hi@"/>
      <stop offset="0.7" stop-color="@mid@"/>
      <stop offset="1" stop-color="@lo@"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.30"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <path id="shell" d="M 64 22 C 97 22 115 25 117.5 47 C 119.5 66 117 88 103 98 C 93 105 80 106 64 106 C 48 106 35 105 25 98 C 11 88 8.5 66 10.5 47 C 13 25 31 22 64 22 Z"
        fill="url(#body)" stroke="@edge@" stroke-opacity="@edgea@" stroke-width="1.1"/>
  <path d="M 64 22 C 97 22 115 25 117.5 47 C 119.5 66 117 88 103 98 C 93 105 80 106 64 106 C 48 106 35 105 25 98 C 11 88 8.5 66 10.5 47 C 13 25 31 22 64 22 Z"
        fill="url(#shade)"/>
  <!-- seam -->
  <path d="M 11 56 C 40 58.5 88 58.5 117 56" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.1"/>
  <path d="M 11 57.6 C 40 60 88 60 117 57.6" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="0.8"/>
  <!-- battery light bar -->
  <rect x="50" y="63" width="28" height="3" rx="1.5" fill="#ffffff" opacity="0.55" filter="url(#glow)"/>
  <rect x="51" y="63.3" width="26" height="2.4" rx="1.2" fill="#ffffff"/>
</svg>
