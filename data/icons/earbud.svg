      <!-- nozzle opening -->
      <path d="M 336.0 776.0 C 343.8 773.8 354.3 773.7 362.0 775.0 C 369.7 776.3 376.3 779.0 382.0 784.0 C 387.7 789.0 392.5 797.0 396.0 805.0 C 399.5 813.0 402.3 823.2 403.0 832.0 C 403.7 840.8 402.8 850.8 400.0 858.0 C 397.2 865.2 392.0 871.3 386.0 875.0 C 380.0 878.7 372.0 880.5 364.0 880.0 C 356.0 879.5 345.7 876.0 338.0 872.0 C 330.3 868.0 323.2 862.5 318.0 856.0 C 312.8 849.5 309.0 841.0 307.0 833.0 C 305.0 825.0 304.7 815.5 306.0 808.0 C 307.3 800.5 310.0 793.3 315.0 788.0 C 320.0 782.7 328.2 778.2 336.0 776.0 Z" fill="#141415"/>
      <g clip-path="url(#boreclip)">
        <path d="M 336.0 776.0 C 343.8 773.8 354.3 773.7 362.0 775.0 C 369.7 776.3 376.3 779.0 382.0 784.0 C 387.7 789.0 392.5 797.0 396.0 805.0 C 399.5 813.0 402.3 823.2 403.0 832.0 C 403.7 840.8 402.8 850.8 400.0 858.0 C 397.2 865.2 392.0 871.3 386.0 875.0 C 380.0 878.7 372.0 880.5 364.0 880.0 C 356.0 879.5 345.7 876.0 338.0 872.0 C 330.3 868.0 323.2 862.5 318.0 856.0 C 312.8 849.5 309.0 841.0 307.0 833.0 C 305.0 825.0 304.7 815.5 306.0 808.0 C 307.3 800.5 310.0 793.3 315.0 788.0 C 320.0 782.7 328.2 778.2 336.0 776.0 Z" fill="#2c2c2d"/>
        <path d="M 336.0 776.0 C 343.8 773.8 354.3 773.7 362.0 775.0 C 369.7 776.3 376.3 779.0 382.0 784.0 C 387.7 789.0 392.5 797.0 396.0 805.0 C 399.5 813.0 402.3 823.2 403.0 832.0 C 403.7 840.8 402.8 850.8 400.0 858.0 C 397.2 865.2 392.0 871.3 386.0 875.0 C 380.0 878.7 372.0 880.5 364.0 880.0 C 356.0 879.5 345.7 876.0 338.0 872.0 C 330.3 868.0 323.2 862.5 318.0 856.0 C 312.8 849.5 309.0 841.0 307.0 833.0 C 305.0 825.0 304.7 815.5 306.0 808.0 C 307.3 800.5 310.0 793.3 315.0 788.0 C 320.0 782.7 328.2 778.2 336.0 776.0 Z" fill="url(#boreg)"/>
        <path d="M 345.0 776.0 C 348.0 772.8 364.5 776.2 372.0 779.0 C 379.5 781.8 385.2 787.0 390.0 793.0 C 394.8 799.0 398.7 807.2 401.0 815.0 C 403.3 822.8 404.3 832.2 404.0 840.0 C 403.7 847.8 401.5 856.3 399.0 862.0 C 396.5 867.7 392.8 875.7 389.0 874.0 C 385.2 872.3 380.2 860.3 376.0 852.0 C 371.8 843.7 367.7 833.0 364.0 824.0 C 360.3 815.0 357.2 806.0 354.0 798.0 C 350.8 790.0 342.0 779.2 345.0 776.0 Z" fill="url(#meshg)"/>
        <path d="M 345.0 776.0 C 348.0 772.8 364.5 776.2 372.0 779.0 C 379.5 781.8 385.2 787.0 390.0 793.0 C 394.8 799.0 398.7 807.2 401.0 815.0 C 403.3 822.8 404.3 832.2 404.0 840.0 C 403.7 847.8 401.5 856.3 399.0 862.0 C 396.5 867.7 392.8 875.7 389.0 874.0 C 385.2 872.3 380.2 860.3 376.0 852.0 C 371.8 843.7 367.7 833.0 364.0 824.0 C 360.3 815.0 357.2 806.0 354.0 798.0 C 350.8 790.0 342.0 779.2 345.0 776.0 Z" fill="url(#mesh)"/>
        <!-- inner wall, darker at the back -->
        <path d="M 312.0 795.0 C 313.7 782.3 328.7 781.2 335.0 782.0 C 341.3 782.8 346.2 791.2 350.0 800.0 C 353.8 808.8 357.0 823.7 358.0 835.0 C 359.0 846.3 361.5 864.2 356.0 868.0 C 350.5 871.8 332.3 870.2 325.0 858.0 C 317.7 845.8 310.3 807.7 312.0 795.0 Z" fill="#000" opacity="0.45" filter="url(#soft1)"/>
        <!-- inner lip shadow along the top rim -->
        <path d="M 336.0 776.0 C 343.8 773.8 354.3 773.7 362.0 775.0 C 369.7 776.3 376.3 779.0 382.0 784.0 C 387.7 789.0 392.5 797.0 396.0 805.0 C 399.5 813.0 402.3 823.2 403.0 832.0 C 403.7 840.8 402.8 850.8 400.0 858.0 C 397.2 865.2 392.0 871.3 386.0 875.0 C 380.0 878.7 372.0 880.5 364.0 880.0 C 356.0 879.5 345.7 876.0 338.0 872.0 C 330.3 868.0 323.2 862.5 318.0 856.0 C 312.8 849.5 309.0 841.0 307.0 833.0 C 305.0 825.0 304.7 815.5 306.0 808.0 C 307.3 800.5 310.0 793.3 315.0 788.0 C 320.0 782.7 328.2 778.2 336.0 776.0 Z" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="10" filter="url(#soft2)" transform="translate(0 5)"/>
      </g>
