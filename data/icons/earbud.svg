  </g>
  <!-- side letter (gold), never mirrored -->
  <text x="64" y="104" font-family="'Montserrat','Poppins','Helvetica Neue',Arial,sans-serif" font-size="7.6"
        font-weight="600" fill="#c8b388" text-anchor="middle">@letter@</text>
</svg>