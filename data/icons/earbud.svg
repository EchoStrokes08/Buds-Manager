<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- REDMI Buds 8 Pro earbud, front view like the official app: straight stem on the outer side, bulbous
       head, silicone tip facing the other earbud. Drawn for the left one; @flip@ mirrors the body for the
       right one while the side letter (@letter@) stays readable. @tokens@ = palette (art.BUDS_COLORS). -->
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="@lo@"/>
      <stop offset="0.38" stop-color="@hi@"/>
      <stop offset="0.62" stop-color="@mid@"/>
      <stop offset="1" stop-color="@lo@"/>
    </linearGradient>
    <radialGradient id="head" cx="0.42" cy="0.36" r="0.72">
      <stop offset="0" stop-color="@hi@"/>
      <stop offset="0.55" stop-color="@mid@"/>
      <stop offset="1" stop-color="@lo@"/>
    </radialGradient>
    <radialGradient id="tip" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="@tiphi@"/>
      <stop offset="0.6" stop-color="@tipmid@"/>
      <stop offset="1" stop-color="@tiplo@"/>
    </radialGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="44" x2="0" y2="68">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="stemfade" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect x="0" y="0" width="128" height="128" fill="url(#fade)"/>
    </mask>
    <radialGradient id="mic" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9bec4"/>
    </radialGradient>
  </defs>
  <g transform="@flip@">
    <!-- head (hump over the stem + bulb towards the centre) -->
    <path d="M 15 50 C 15 33 25 24 42 22 C 62 20 82 26 90 42 C 97 56 94 74 80 82 C 68 89 52 88 44 80 C 40 76 38 70 38 64 L 38 76 L 15 76 Z"
          fill="url(#head)"/>
    <!-- stem, drawn over the head and faded in from it (smooth join) -->
    <rect x="15" y="34" width="23" height="84" rx="11.5" fill="url(#stem)" mask="url(#stemfade)"/>
    <path d="M 15 52 L 15 106.5 A 11.5 11.5 0 0 0 38 106.5 L 38 64" fill="none" stroke="@edge@" stroke-opacity="@edgea@" stroke-width="1"/>
    <!-- outline only on the exposed contour (not where the head joins the stem) -->
    <path d="M 15 52 L 15 50 C 15 33 25 24 42 22 C 62 20 82 26 90 42 C 97 56 94 74 80 82 C 68 89 52 88 44 80 C 40 76 38 70 38 64"
          fill="none" stroke="@edge@" stroke-opacity="@edgea@" stroke-width="1"/>
    <!-- soft highlight on the bulb -->
    <ellipse cx="58" cy="42" rx="14" ry="11" fill="#fff" opacity="0.10"/>
    <ellipse cx="54" cy="36" rx="7" ry="4.5" fill="#fff" opacity="0.13"/>
    <!-- vent slit at the top of the stem -->
    <rect x="19.5" y="37" width="2.2" height="9" rx="1.1" fill="@lo@" opacity="0.9"/>
    <!-- stem highlight -->
    <rect x="24" y="62" width="3.2" height="48" rx="1.6" fill="#fff" opacity="0.14"/>
    <!-- silicone ear tip, facing the other earbud -->
    <!-- truncated cone: narrow where it meets the head, wide flat face angled towards the ear -->
    <path d="M 74 57 C 82 53 92 53 99 57 C 105 61 108 70 106 80 C 104 89 99 95 92 96 C 85 97 79 94 75 88 C 71 79 71 66 74 57 Z"
          fill="url(#tip)" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>
    <!-- flat face (the opening) -->
    <path d="M 99 57 C 105 61 108 70 106 80 C 104 89 99 95 92 96 C 96 88 98 79 98 70 C 98 64 99 60 99 57 Z"
          fill="#000" opacity="0.28"/>
    <path d="M 74 57 C 71 67 71 79 75 88" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 80 57 C 87 55 93 56 97 59" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2.2" stroke-linecap="round"/>
    <!-- microphone at the bottom of the stem -->
    <ellipse cx="26.5" cy="112" rx="4.2" ry="2.8" fill="url(#mic)"/>
  </g>
  <!-- side letter (gold), never mirrored -->
  <text x="@lx@" y="101" font-family="sans-serif" font-size="8" font-weight="700" fill="#c9a36b" text-anchor="middle">@letter@</text>
</svg>
