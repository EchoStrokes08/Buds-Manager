      <path d="M 360.0 640.0 C 360.0 625.8 396.7 593.3 420.0 575.0 C 443.3 556.7 491.7 525.8 500.0 530.0 C 508.3 534.2 483.3 578.3 470.0 600.0 C 456.7 621.7 438.3 653.3 420.0 660.0 C 401.7 666.7 360.0 654.2 360.0 640.0 Z" fill="#000" opacity="0.2" filter="url(#soft)"/>
      <!-- bounce light along the right edge -->
      <path d="M 392.0 622.0 C 398.2 614.8 416.0 590.8 429.0 579.0 C 442.0 567.2 457.5 558.3 470.0 551.0 C 482.5 543.7 491.7 539.5 504.0 535.0 C 516.3 530.5 530.2 526.3 544.0 524.0 C 557.8 521.7 573.5 520.3 587.0 521.0 C 600.5 521.7 613.3 524.5 625.0 528.0 C 636.7 531.5 648.0 537.0 657.0 542.0 C 666.0 547.0 672.0 552.0 679.0 558.0 C 686.0 564.0 693.2 571.3 699.0 578.0 C 704.8 584.7 708.8 589.5 714.0 598.0 C 719.2 606.5 725.8 618.0 730.0 629.0 C 734.2 640.0 737.3 653.8 739.0 664.0 C 740.7 674.2 741.3 678.2 740.0 690.0 C 738.7 701.8 735.7 721.7 731.0 735.0 C 726.3 748.3 719.2 759.0 712.0 770.0 C 704.8 781.0 695.8 792.0 688.0 801.0 C 680.2 810.0 673.8 816.2 665.0 824.0 C 656.2 831.8 640.0 844.0 635.0 848.0" fill="none" stroke="#8a9097" stroke-opacity="0.55" stroke-width="7" filter="url(#soft1)" transform="translate(-6 0)"/>
      <!-- the slit on top of the head -->
      <path d="M 506 549 Q 555 537 604 545" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round" filter="url(#soft2)"/>
      <path d="M 506 543 Q 555 530 604 539" fill="none" stroke="#050505" stroke-width="7" stroke-linecap="round"/>
      <!-- contact shadow cast by the ear tip -->
      <use href="#tipshape" fill="#000" opacity="0.45" filter="url(#soft1)" transform="translate(7 3)"/>
    </g>
    <use href="#head" fill="none" stroke="#8a9097" stroke-opacity="0.25" stroke-width="2"/>

    <!-- ===== silicone ear tip ===== -->
    <use href="#tipshape" fill="url(#tipg)"/>
    <g clip-path="url(#tipclip)">
      <rect x="260" y="640" width="300" height="300" fill="url(#tipshade)"/>
